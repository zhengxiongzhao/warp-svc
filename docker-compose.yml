version: '3.8'

services:
  cloudflare-warp:
    container_name: cloudflare-warp
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:1080:1080"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - BIND_ADDR=0.0.0.0
      - BIND_PORT=1080
      # 手动指定 Endpoint（最高优先级，设置后跳过自动优选）
      # - ENDPOINT_IP=162.159.192.1:2408
      # 自动优选开关（默认启用）
      # - ENDPOINT_AUTO=1
      # 自定义候选 IP 列表（空格分隔，默认使用内置 WARP 核心段 + Cloudflare Anycast 抽样）
      # - ENDPOINT_IPS=162.159.192.1 162.159.193.1 162.159.193.5 162.159.194.1 162.159.195.1 162.159.196.1 162.159.197.1 104.16.0.1 104.24.0.1 172.64.0.1 162.158.0.1
      # 自定义候选端口（空格分隔）
      # - ENDPOINT_PORTS=2408 500 4500 1701 4443 8443 51820
      # 每个 Endpoint 握手测试超时（秒）
      # - ENDPOINT_TEST_TIMEOUT=8
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "3"
    # volumes:
    #   - warp-data:/etc/wireguard

volumes:
  warp-data:
