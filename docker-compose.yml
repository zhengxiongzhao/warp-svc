services:
  cloudflare-warp:
    # image: zhengxiongzhao/warp-svc:latest
    container_name: cloudflare-warp
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    device_cgroup_rules:
      - 'c 10:200 rwm'
    ports:
      - "1080:1080"
    mem_limit: 512m
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - TZ=Asia/Shanghai
      - BIND_PORT=1080
      - LOG_LEVEL=error
      # - SOCKS_USER=admin       # optional: enable SOCKS5 auth
      # - SOCKS_PASS=123456      # requires SOCKS_USER
      # - WARP_AUTO_RESTART=     # optional: set empty to disable auto-restart (enabled by default)
      # - WARP_MONITOR_INTERVAL=30  # optional: check interval in seconds
      # - WARP_MONITOR_RETRIES=5    # optional: consecutive failures before restart
    # Optional: Persist WARP account data
    volumes:
      - ./data:/var/lib/cloudflare-warp
